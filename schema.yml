components:
  schemas:
    ActiveRequest:
      type: object
      properties:
        is_active:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - is_active
      - reason
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 60
        recipient_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 32
        region:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        address_line:
          type: string
          maxLength: 300
        landmark:
          type: string
          maxLength: 300
        is_default:
          type: boolean
      required:
      - address_line
      - city
      - id
      - label
      - phone
      - recipient_name
      - region
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        recipient_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          minLength: 1
          maxLength: 32
        region:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        address_line:
          type: string
          minLength: 1
          maxLength: 300
        landmark:
          type: string
          maxLength: 300
        is_default:
          type: boolean
      required:
      - address_line
      - city
      - label
      - phone
      - recipient_name
      - region
    AdjustmentRequest:
      type: object
      properties:
        delta:
          type: integer
          maximum: 1000000

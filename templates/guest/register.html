{% extends 'layouts/guest.html' %}{% load ui %}{% block content %}<section class="auth-card"><p class="eyebrow">TRENDBOX</p><h1>{% tr 'register' %}</h1><form data-auth="register">{% csrf_token %}<div class="error" role="alert" hidden></div><label>{% tr 'full_name' %}<input name="full_name" type="text" autocomplete="name" required></label><label>{% tr 'email' %}<input name="email" type="email" autocomplete="email" required></label><label>{% tr 'phone' %}<input name="phone" type="tel" autocomplete="tel" required></label><label>{% tr 'password' %}<input name="password" type="password" autocomplete="new-password" required></label><label>{% tr 'password_confirm' %}<input name="password_confirm" type="password" autocomplete="new-password" required></label><label class="checkbox"><input type="checkbox" data-show-password>{% tr 'show_password' %}</label><button type="submit">{% tr 'register' %}</button></form><a href="/login/">{% tr 'login' %}</a></section>{% endblock %}

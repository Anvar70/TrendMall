{% load ui %}<form action="/language/" method="post" class="language-form">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><label><span class="sr-only">{% tr 'choose_language' %}</span><select name="language" aria-label="Language"><option value="uz" {% if request.LANGUAGE_CODE == 'uz' %}selected{% endif %}>UZ</option><option value="ru" {% if request.LANGUAGE_CODE == 'ru' %}selected{% endif %}>RU</option><option value="en" {% if request.LANGUAGE_CODE == 'en' %}selected{% endif %}>EN</option></select></label><button type="submit" class="quiet">?</button></form>
